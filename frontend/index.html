<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Intelligence Pro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>🌦️ Weather Intelligence Pro</h1>
        <p>Your Smart Weather Dashboard</p>
    </header>

    <main>
        <section class="search-section">
            <h2>Check Your Weather</h2>

            <form id="searchForm">
                <input
                    type="text"
                    id="cityInput"
                    placeholder="Enter city name"
                    required
                >
                <button type="submit">Search</button>
            </form>

            <p id="statusMessage"></p>
        </section>
        
<section class="weather-section" id="weatherSection">
    <h2>Current Weather</h2>

    <div class="weather-card">
        <h3 id="weatherCity">Pune</h3>

        <div class="temperature">
            <span id="temperature">28</span>°C
        </div>

        <p id="weatherCondition">Partly Cloudy</p>
        
<p class="feels-like">
    Feels Like: <strong id="feelsLike">--</strong>°C
</p>

<p class="last-updated" id="lastUpdated">
    Last updated: --
</p>


        <div class="weather-details">
            <div class="weather-detail">
                <span>💧 Humidity</span>
                <strong id="humidity">65%</strong>
            </div>

            <div class="weather-detail">
                <span>💨 Wind Speed</span>
                <strong id="windSpeed">12 km/h</strong>
            </div>

            
<div class="weather-detail">
    <span>🌧️ Precipitation</span>
    <strong id="precipitation">-- mm</strong>
</div>

        </div>
    </div>
</section>

<!-- Hourly Weather Forecast -->

<section class="hourly-section">
    <h2>Hourly Forecast</h2>

    <div class="hourly-container" id="hourlyForecast">
        <p>Hourly forecast will appear here.</p>
    </div>
</section>


    </main>

    <script src="js/app.js"></script>
</body>
</html>
